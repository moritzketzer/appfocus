name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: make all

      # Serial on shared runners because parallel-suite GCD starvation times out event waits (observed 2026-09-21 and 2026-10-19).
      - name: Test
        run: make test-serial
